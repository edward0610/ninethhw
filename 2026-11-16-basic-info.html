        <h3>公貓結紮</h3>
        <ul>
            <li>手術方式：摘除睪丸。</li>
            <li>手術時間：很快，大概10-15分鐘。</li>
            <li>恢復期：傷口很小，通常2-3天就恢復活力了，但還是要戴頭套防舔。</li>
        </ul>

        <h3>母貓結紮</h3>
        <ul>
            <li>手術方式：開腹摘除卵巢及子宮。</li>
            <li>手術時間：大概30-45分鐘。</li>
            <li>恢復期：因為有傷口，需要7-10天，還要穿防舔衣。</li>
        </ul>
    </div>
